services:
  db-mysql:
    image: mysql:8.3
    container_name: database_autopop
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: crazy907_autopop
      MYSQL_USER: admin
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - '3306:3306'
    expose:
      - '3306'
  redis:
    image: "redis:7.4.1"
    container_name: redis-autopop 
    ports:
      - '6379:6379'